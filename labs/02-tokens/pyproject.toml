[project]
name = "tokens"
version = "0.1.0"
description = "Lab 02: count tokens locally, compare against what each provider reports and bills, and separate tokenizer differences from chat-template overhead."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tiktoken>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
