[project]
name = "params"
version = "0.1.0"
description = "Lab 03: measure what temperature and top_p do to output variance, test whether temperature 0 is actually deterministic, and price the difference."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
