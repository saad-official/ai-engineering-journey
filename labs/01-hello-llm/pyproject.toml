[project]
name = "hello-llm"
version = "0.1.0"
description = "Lab 01: the same prompt against every provider through one OpenAI-compatible client; log tokens, latency, cost."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
