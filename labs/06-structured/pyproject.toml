[project]
name = "structured"
version = "0.1.0"
description = "Lab 06: extract a Pydantic Invoice from messy text four ways (prompt-only, JSON mode, strict JSON schema, forced tool call), break it with adversarial documents, and measure schema validity, semantic validity, field accuracy and invented values separately."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
