[project]
name = "stream"
version = "0.1.0"
description = "Lab 05: stream a completion to the terminal, then through a FastAPI SSE endpoint, then into a no-build browser page via fetch + ReadableStream - measuring time to first chunk, time to first VISIBLE token, total time, and whether usage survives streaming."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Already installed by fastapi/httpx; declared because server.py imports it directly
    # (anyio.CancelScope shields the upstream close during cancellation).
    "anyio>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
