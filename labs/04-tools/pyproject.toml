[project]
name = "tools"
version = "0.1.0"
description = "Lab 04: a two-tool agent loop written by hand with no framework - model, tool call, execute, return, final answer - printing the full message array at every step, measuring what a system message and each tool schema cost in prompt tokens, and deliberately exercising every failure path."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
