[project]
name = "llm-kit"
version = "0.1.0"
description = "A thin, fully-understood provider layer over any OpenAI-compatible LLM API: completions, structured outputs, streaming, a tool loop, retries, and per-call cost accounting. Not a framework."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_kit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
