[project]
name = "teardown-01-next-fastapi"
version = "0.1.0"
description = "Teardown 01: vercel/ai examples/next-fastapi - run the original backend against Gemini, capture its wire bytes, and port it to the current UI message stream protocol."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=1.60",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    # the original api/index.py imports it at module level
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
